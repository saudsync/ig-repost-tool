name: Fetch new posts and generate captions
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  fetch-and-caption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch posts
        env:
          SOURCE_IG_USERNAME: ${{ vars.SOURCE_IG_USERNAME }}
        run: python scripts/fetch_posts.py --username "zallbury_store"
      - name: Generate captions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_captions.py
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Fetch new posts and generate captions" || echo "No changes"
          git push
